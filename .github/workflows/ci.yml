name: CI

on:
  push:
    paths:
      - 'web/**'
      - 'engine/**'
  pull_request:
    paths:
      - 'web/**'
      - 'engine/**'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm --prefix web ci
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Unit tests (Lighthouse budget policy + core logic)
        run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Drift check
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run 'npm --prefix web run build' and commit the result before pushing."
            exit 1
          fi
      - name: CI Variance Policy
        run: |
          echo "Lighthouse Budget Policy"
          echo "========================"
          echo ""
          echo "Approved Baselines (local production median):"
          echo "  /: performance 85, accessibility 100, best-practices 100, seo 100"
          echo "  /openings: performance 75, accessibility 100, best-practices 100, seo 100"
          echo ""
          echo "CI Variance Tolerance: +5 points"
          echo "  Accounts for GitHub runner noise in real-Chrome Lighthouse measurements."
          echo "  Measured local median - tolerance = CI floor"
          echo ""
          echo "CI Floors (pass if measured >= floor):"
          echo "  /: performance 80, strict categories 100"
          echo "  /openings: performance 70, strict categories 100"
          echo ""
          echo "Strict Categories (must stay 100):"
          echo "  - accessibility"
          echo "  - best-practices"
          echo "  - seo"
          echo ""
          echo "Rationale:"
          echo "  GitHub runner CI variance is ~5 points. A 3-point tolerance (75→72) causes flaky CI."
          echo "  5-point tolerance is conservative, documented, and tied to measured baselines."
