name: CI

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'web/**'
      - 'engine/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'web/**'
      - 'engine/**'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm --prefix web ci
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Test
        run: npm --prefix web test
      - run: npm --prefix web run build
      - name: React Doctor
        run: npm --prefix web run react-doctor
      - name: Production devtools leak scan
        run: npm --prefix web run verify:no-devtools
      - name: Approved real-Chrome performance budget
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 8000 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID' EXIT
          sleep 2
          LIGHTHOUSE_ENFORCE_BUDGET=1 npm --prefix web run lighthouse:real-chrome
      - name: Drift check
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run 'npm --prefix web run build' and commit the result before pushing."
            exit 1
          fi
      # Run browser QA only after the build/drift gate: Playwright creates HTML
      # reports that Tailwind v4 would otherwise scan as source during Vite build.
      - name: Complete Playwright suite
        run: npx playwright install --with-deps chromium && npm --prefix web run test:e2e
