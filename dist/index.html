    <script>
      (() => {
        const routeMetadata = {
          '/play': ['Play', 'Play chess against Stockfish on chesswithprince.com.'],
          '/openings': ['Openings', 'Explore chess openings on chesswithprince.com.'],
          '/games': ['Games', 'Browse chess games on chesswithprince.com.'],
          '/study': ['Study', 'Study chess positions on chesswithprince.com.'],
        }

        const applyRouteMetadata = () => {
          const [title, description] =
            routeMetadata[window.location.pathname] ?? [
              'chesswithprince.com',
              'Play and study chess on chesswithprince.com.',
            ]
          const canonicalUrl = `https://play.chesswithprince.com${window.location.pathname}`
          const fullTitle = `${title} — chesswithprince.com`
          document.title = fullTitle
          document.querySelector('meta[name="description"]')?.setAttribute('content', description)
          document.querySelector('link[rel="canonical"]')?.setAttribute('href', canonicalUrl)
          document.querySelector('meta[property="og:title"]')?.setAttribute('content', fullTitle)
          document.querySelector('meta[property="og:description"]')?.setAttribute('content', description)
          document.querySelector('meta[property="og:url"]')?.setAttribute('content', canonicalUrl)
          document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', fullTitle)
          document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', description)
        }

        for (const method of ['pushState', 'replaceState']) {
          const original = history[method]
          history[method] = function (...args) {
            const result = original.apply(this, args)
            applyRouteMetadata()
            return result
          }
        }

        addEventListener('popstate', applyRouteMetadata)
        applyRouteMetadata()
      })()
    </script>
